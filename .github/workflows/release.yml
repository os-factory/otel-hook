name: Release

# Prepares provenance-ready release artifacts for a tagged candidate. It never
# runs `npm publish`: package.json's `"private": true` is the actual gate, and
# is intentionally left in place until the integration owner reviews this
# draft release and promotes it (see docs/release-checklist.md). This
# workflow's job is to make that promotion a five-minute review, not a rebuild.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build the release candidate from"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-artifacts:
    name: build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full verification (typecheck, lint, test, build)
        run: npm run check

      - name: Pack / install / API / binary smoke test
        run: node scripts/packaging/pack-smoke-test.mjs --skip-build

      - name: Check dependency licenses
        run: node scripts/security/check-licenses.mjs

      - name: Generate SBOMs
        run: |
          npm sbom --sbom-format cyclonedx > sbom.cdx.json
          npm sbom --sbom-format spdx > sbom.spdx.json

      - name: Pack release tarball
        run: |
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts
          cp sbom.cdx.json sbom.spdx.json release-artifacts/

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "release-artifacts/*.tgz"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release-artifacts/
          retention-days: 90

      - name: Create draft GitHub release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --generate-notes \
            --title "$TAG (draft: package remains private)" \
            release-artifacts/*.tgz release-artifacts/*.json

      - name: Summary
        run: |
          {
            echo "### Release artifacts prepared for \`${GITHUB_REF_NAME:-${{ inputs.ref }}}\`"
            echo
            echo "- Package remains \`\"private\": true\`. No \`npm publish\` ran."
            echo "- A **draft** GitHub release was created with the packed tarball, both SBOM formats, and a build provenance attestation."
            echo "- Promotion checklist: docs/release-checklist.md"
          } >> "$GITHUB_STEP_SUMMARY"
