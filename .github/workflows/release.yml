name: Release

# Cut a semver release from Conventional Commit / squash-merge titles on main,
# then publish @osfactory/otel-hook to npm with provenance. Modeled on
# os-factory/har's Release workflow (without Docker coupling).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Analyze commits and print the next release without publishing
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install and verify
        run: |
          npm ci
          npm run check

      - name: Pack / install / API / binary smoke test
        run: node scripts/packaging/pack-smoke-test.mjs --skip-build

      - name: Check dependency licenses
        run: node scripts/security/check-licenses.mjs

  release:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      released: ${{ steps.detect.outputs.released }}
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record latest tag before release
        id: before
        run: |
          TAG="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Semantic release (version cut + GitHub Release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi

      - name: Detect published release
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force
          TAG="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          BEFORE="${{ steps.before.outputs.tag }}"

          if [ -n "$TAG" ] && [ "$TAG" != "$BEFORE" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "Published $TAG"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No new release"
          fi

  publish-npm:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Build, pack, SBOM, attest, publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          EXPECTED="${{ needs.release.outputs.version }}"
          ACTUAL="$(node -p "require('./package.json').version")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "package.json version ($ACTUAL) does not match tag v${EXPECTED}" >&2
            exit 1
          fi
          npm ci
          npm run build
          mkdir -p release-artifacts
          npm sbom --sbom-format cyclonedx > release-artifacts/sbom.cdx.json
          npm sbom --sbom-format spdx > release-artifacts/sbom.spdx.json
          npm pack --pack-destination release-artifacts
          npm publish --access public --provenance
          echo "Published @osfactory/otel-hook@${EXPECTED} to npm"

      - name: Attest build provenance (GitHub)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "release-artifacts/*.tgz"

      - name: Upload release artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          gh release upload "$TAG" release-artifacts/* --clobber
