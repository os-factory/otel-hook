name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Primary matrix: every supported Node major on Linux, where CI capacity is
  # cheapest and where every PR should get fast, full-coverage feedback.
  linux:
    name: linux (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate fixture provenance
        run: npm run fixtures:validate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # Build precedes test: the end-to-end suite drives the built CLI binary as
      # a child process, which is the only way to observe a hook's stdout
      # contract, stderr diagnostics, and exit code.
      - name: Build
        run: npm run build
      - name: Test (unit, e2e, parity, packaging)
        run: npm test

  # macOS runners are the most expensive, so PRs that leave the library alone
  # (docs, release tooling, CI config, harness files) skip macOS. Pushes to
  # main always run the full cross-platform matrix.
  changes:
    name: detect library changes
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.matrix.outputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Pick cross-platform runners
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Library core: what the macOS job builds, tests or packs.
          CORE='^(src/|tests/|fixtures/|scripts/(packaging|parity)/|package(-lock)?\.json$|tsconfig\.json$|tsup\.config\.ts$|vitest\.config\.ts$)'
          if [ "$EVENT" != "pull_request" ] || git diff --name-only "$BASE...$HEAD" | grep -Eq "$CORE"; then
            echo 'os=["macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo "No library changes: skipping macOS."
            echo 'os=["windows-latest"]' >> "$GITHUB_OUTPUT"
          fi

  # Targeted, single-Node-version paths on the other two platforms, per the
  # release-hardening compatibility policy (docs/compatibility-policy.md):
  # cross-platform correctness matters, but a full N-version matrix on every
  # OS is not worth the CI minutes for a hooks library whose only OS-sensitive
  # surfaces are process spawning and filesystem paths.
  cross-platform:
    name: ${{ matrix.os }} (node 22)
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # Build precedes test: the end-to-end suite drives the built CLI binary as
      # a child process, which is the only way to observe a hook's stdout
      # contract, stderr diagnostics, and exit code.
      - name: Build
        run: npm run build
      - name: Test (unit, e2e, parity, packaging)
        run: npm test

  package-contents:
    name: package contents guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Pack / install / API / binary smoke test
        run: node scripts/packaging/pack-smoke-test.mjs
